<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="sh" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2449" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="730" fill="#f4f6fa"/>

  <!-- header -->
  <rect width="1200" height="110" fill="#1b2449"/>
  <rect y="110" width="1200" height="5" fill="#e8892b"/>
  <text x="40" y="58" font-size="36" font-weight="700" fill="#ffffff">系统架构</text>
  <text x="40" y="92" font-size="18" fill="#f0a64a">五层架构 · 全链路自动化</text>

  <!-- layer 1 -->
  <g filter="url(#sh)">
    <rect x="40" y="145" width="1120" height="86" rx="6" fill="#ffffff"/>
    <path d="M46 145 H240 V231 H46 a6 6 0 0 1 -6 -6 V151 a6 6 0 0 1 6 -6 z" fill="#1b2449"/>
  </g>
  <text x="140" y="195" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">① 输入层</text>
  <text x="272" y="194" font-size="17" fill="#2a2f3a">企业微信机器人  /  HTTP 接口 (Flask :60234)  /  自然语言文本</text>

  <path d="M132 241 h16 l-8 11 z" fill="#e8892b"/>

  <!-- layer 2 -->
  <g filter="url(#sh)">
    <rect x="40" y="262" width="1120" height="86" rx="6" fill="#ffffff"/>
    <path d="M46 262 H240 V348 H46 a6 6 0 0 1 -6 -6 V268 a6 6 0 0 1 6 -6 z" fill="#3d8bdb"/>
  </g>
  <text x="140" y="312" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">② LLM 提取层</text>
  <text x="272" y="311" font-size="17" fill="#2a2f3a">蓝鲸 AI API — 解析 uid / 时间 / 问题类型</text>

  <path d="M132 358 h16 l-8 11 z" fill="#e8892b"/>

  <!-- layer 3 -->
  <g filter="url(#sh)">
    <rect x="40" y="379" width="1120" height="86" rx="6" fill="#ffffff"/>
    <path d="M46 379 H240 V465 H46 a6 6 0 0 1 -6 -6 V385 a6 6 0 0 1 6 -6 z" fill="#3e7d3e"/>
  </g>
  <text x="140" y="429" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">③ 数据采集层</text>
  <text x="272" y="428" font-size="17" fill="#2a2f3a">MySQL 分库（延迟 / 异常 / 宕机）  +  蓝鲸数据平台（运营商）  +  SQLite 历史库</text>

  <path d="M132 475 h16 l-8 11 z" fill="#e8892b"/>

  <!-- layer 4 -->
  <g filter="url(#sh)">
    <rect x="40" y="496" width="1120" height="86" rx="6" fill="#ffffff"/>
    <path d="M46 496 H240 V582 H46 a6 6 0 0 1 -6 -6 V502 a6 6 0 0 1 6 -6 z" fill="#6a2a9c"/>
  </g>
  <text x="140" y="546" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">④ 分析引擎层</text>
  <text x="272" y="545" font-size="17" fill="#2a2f3a">analyzer.py — 个人问题 / 对局共性 / 运营商共性  三级判断</text>

  <path d="M132 592 h16 l-8 11 z" fill="#e8892b"/>

  <!-- layer 5 -->
  <g filter="url(#sh)">
    <rect x="40" y="613" width="1120" height="86" rx="6" fill="#ffffff"/>
    <path d="M46 613 H240 V699 H46 a6 6 0 0 1 -6 -6 V619 a6 6 0 0 1 6 -6 z" fill="#e8892b"/>
  </g>
  <text x="140" y="663" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">⑤ 输出层</text>
  <text x="272" y="662" font-size="16" textLength="860" lengthAdjust="spacingAndGlyphs" fill="#2a2f3a">DeepSeek-R1 生成中文报告  →  脱敏处理（隐藏服务器 IP / DS 配置等敏感信息）  →  企业微信推送 / HTTP 返回 / 历史库存储</text>
</svg>
